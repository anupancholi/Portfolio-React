<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 58" width="300" height="58">
  <!-- ImpactMatrix wordmark — dark theme -->
  <text x="150" y="36" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="42" font-weight="800" letter-spacing="-0.4">
    <tspan fill="#ffffff">Impact</tspan><tspan fill="#00C9C8">Matrix</tspan>
  </text>

  <!-- Thin divider -->
  <rect x="50" y="44" width="200" height="0.7" fill="#00C9C8" fill-opacity="0.50"/>

  <!-- HUMANITARIAN SUPPLY CHAIN tagline — highlighted in teal -->
