        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9" font-weight="700" fill="#00C9C8" fill-opacity="0.92"
        letter-spacing="3.2">HUMANITARIAN SUPPLY CHAIN</text>
